name: Build and Deploy Coinservice

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - development
  workflow_dispatch:

# Required for OIDC login to Azure
permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    # GHA Environment gates production deploys behind required reviewers if configured.
    # Create "production" and "development" environments in repo Settings → Environments.
    # base_ref is the target branch on PR events; ref_name is the branch on workflow_dispatch.
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'production' || 'development' }}

    env:
      ENVIRONMENT: ${{ (github.base_ref || github.ref_name) == 'main' && 'production' || 'development' }}

    steps:
      - name: Generate Short-Lived Token from App
        id: app-token
        uses: actions/create-github-app-token@v1 # Use a trusted action
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # The repositories the token needs access to
          repositories: 'beemer-coinservice,beemer-contracts'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: true

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JAR
        run: ./gradlew build

      - name: Get JAR version
        id: jar-version
        run: |
          VERSION=$(./gradlew properties | grep ^version | awk '{ print $2; exit }')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Key Vault
        id: kv
        uses: ./.github/workflows/actions/fetch-secrets
        with:
          vault-name: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          value-secrets: |
            DEPLOY-SSH-KEY
            SSH-PORT
            AZURE-CLIENT-ID
            AZURE-CLIENT-SECRET
          file-secrets: |
            SSL-PRIVATE-KEY-${{ env.ENVIRONMENT == 'production' && 'PRODUCTION' || 'DEVELOPMENT' }},cd/deploy-app/files/coinservice-${{ env.ENVIRONMENT }}-privkey.pem

      - name: Configure SSH
        env:
          SSH_KEY: ${{ fromJSON(steps.kv.outputs.fetched-secrets).deploySshKey }}
          HOST: ${{ github.ref_name == 'main' && vars.PRODUCTION_HOST || vars.DEVELOPMENT_HOST }}
          SSH_PORT: ${{ fromJSON(steps.kv.outputs.fetched-secrets).sshPort }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Setup Ansible
        uses: alex-oleshkevich/setup-ansible@v1.0.1
        with:
          version: "2.21.1"

      - name: Run deploy playbook
        env:
          HOST: ${{ github.ref_name == 'main' && vars.PRODUCTION_HOST || vars.DEVELOPMENT_HOST }}
          SSH_PORT: ${{ fromJSON(steps.kv.outputs.fetched-secrets).sshPort }}
          CLIENT_ID: ${{ fromJSON(steps.kv.outputs.fetched-secrets).azureClientId }}
          CLIENT_SECRET: ${{ fromJSON(steps.kv.outputs.fetched-secrets).azureClientSecret }}
          JAR_VERSION: ${{ steps.jar-version.outputs.version }}
        run: |
          ansible-playbook \
            -i "${HOST}," \
            --private-key ~/.ssh/deploy_key \
            -u deploy \
            -e ansible_port="$SSH_PORT" \
            -e coinservice_environment="$ENVIRONMENT" \
            -e coinservice_jar_src="build/libs/coinservice-$JAR_VERSION.jar" \
            -e coinservice_azure_client_id="$CLIENT_ID" \
            -e coinservice_azure_client_secret="$CLIENT_SECRET" \
            cd/deploy-app/deploy.yml
