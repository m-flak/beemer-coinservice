---
# Playbook: deploy.yml
# Description: Deploy coinservice Spring Boot application to a Linux host via systemd
# Requirements:
#   - Ansible 2.10+
#   - Target hosts: Linux (Debian or RedHat family)
#   - Java 26 installed on target host
# Variables:
#   - coinservice_jar_src: Path to coinservice JAR on the control node (required)
#   - coinservice_azure_client_id: Azure AD client ID fetched from Key Vault in CI (required)
#   - coinservice_azure_client_secret: Azure AD client secret fetched from Key Vault in CI (required)
# Usage:
#   ansible-playbook -i inventory/hosts deploy.yml \
#     -e coinservice_jar_src=../../build/libs/coinservice.jar \
#     -e coinservice_azure_client_id=$AZURE_CLIENT_ID \
#     -e coinservice_azure_client_secret=$AZURE_CLIENT_SECRET

- name: Deploy coinservice to Linux host
  hosts: coinservice_hosts
  become: true
  gather_facts: true

  vars_files:
    - vars/coinservice.yml

  pre_tasks:
    - name: Assert required variables are provided
      ansible.builtin.assert:
        that:
          - coinservice_jar_src is defined
          - coinservice_jar_src | length > 0
          - coinservice_environment is defined
          - coinservice_environment in ['production', 'development']
          - coinservice_azure_client_id is defined
          - coinservice_azure_client_id | length > 0
          - coinservice_azure_client_secret is defined
          - coinservice_azure_client_secret | length > 0
        fail_msg: "coinservice_jar_src, coinservice_environment, coinservice_azure_client_id, and coinservice_azure_client_secret are all required"
      tags:
        - always

    - name: Verify Java is available on target host
      ansible.builtin.command: "{{ coinservice_java_executable }} -version"
      register: java_version_check
      changed_when: false
      failed_when: java_version_check.rc != 0
      tags:
        - always

  tasks:
    - name: Ensure coinservice group exists
      ansible.builtin.group:
        name: "{{ coinservice_group }}"
        system: true
        state: present
      tags:
        - setup
        - user

    - name: Ensure coinservice system user exists
      ansible.builtin.user:
        name: "{{ coinservice_user }}"
        group: "{{ coinservice_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ coinservice_deploy_dir }}"
        create_home: false
        state: present
      tags:
        - setup
        - user

    - name: Ensure deployment directory exists
      ansible.builtin.file:
        path: "{{ coinservice_deploy_dir }}"
        state: directory
        owner: "{{ coinservice_user }}"
        group: "{{ coinservice_group }}"
        mode: '0755'
      tags:
        - setup

    - name: Ensure log directory exists
      ansible.builtin.file:
        path: "{{ coinservice_log_dir }}"
        state: directory
        owner: "{{ coinservice_user }}"
        group: "{{ coinservice_group }}"
        mode: '0750'
      tags:
        - setup

    - name: Ensure environment config directory exists
      ansible.builtin.file:
        path: /etc/coinservice/{{ coinservice_environment }}
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags:
        - setup
        - config

    - name: Ensure SSL certificate directory exists
      ansible.builtin.file:
        path: "{{ coinservice_ssl_dir }}"
        state: directory
        owner: root
        group: "{{ coinservice_group }}"
        mode: '0750'
      tags:
        - setup
        - ssl

    - name: Copy SSL certificate
      ansible.builtin.copy:
        src: "coinservice-{{ coinservice_environment }}-fullchain.pem"
        dest: "{{ coinservice_ssl_certificate }}"
        owner: root
        group: "{{ coinservice_group }}"
        mode: '0644'
      notify: Restart coinservice
      tags:
        - deploy
        - ssl

    - name: Copy SSL private key
      ansible.builtin.copy:
        src: "coinservice-{{ coinservice_environment }}-privkey.pem"
        dest: "{{ coinservice_ssl_certificate_key }}"
        owner: root
        group: "{{ coinservice_group }}"
        mode: '0640'
      notify: Restart coinservice
      tags:
        - deploy
        - ssl

    - name: Deploy environment file
      ansible.builtin.template:
        src: templates/coinservice.env.j2
        dest: /etc/coinservice/{{ coinservice_environment }}/env
        owner: root
        group: "{{ coinservice_group }}"
        mode: '0640'
      no_log: true
      notify: Restart coinservice
      tags:
        - deploy
        - config

    - name: Copy coinservice JAR to target host
      ansible.builtin.copy:
        src: "{{ coinservice_jar_src }}"
        dest: "{{ coinservice_deploy_dir }}/{{ coinservice_jar_name }}"
        owner: "{{ coinservice_user }}"
        group: "{{ coinservice_group }}"
        mode: '0644'
      notify: Restart coinservice
      tags:
        - deploy

    - name: Install coinservice systemd unit
      ansible.builtin.template:
        src: templates/coinservice.service.j2
        dest: /etc/systemd/system/{{ coinservice_service_name }}.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd
        - Restart coinservice
      tags:
        - deploy
        - systemd

    - name: Enable and start coinservice service
      ansible.builtin.systemd:
        name: "{{ coinservice_service_name }}"
        state: started
        enabled: true
        daemon_reload: true
      tags:
        - deploy
        - systemd

  post_tasks:
    - name: Wait for coinservice port to be open
      ansible.builtin.wait_for:
        port: "{{ coinservice_port }}"
        delay: 5
        timeout: 60
        state: started
      tags:
        - verify

    - name: Verify coinservice health endpoint
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ coinservice_port }}/actuator/health"
        method: GET
        status_code: 200
        validate_certs: false
      register: health_check
      until: health_check.status == 200
      retries: 6
      delay: 5
      tags:
        - verify

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart coinservice
      ansible.builtin.systemd:
        name: "{{ coinservice_service_name }}"
        state: restarted
