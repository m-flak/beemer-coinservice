---
# Playbook: setup.yml
# Description: Bootstrap a fresh VPS to production-ready state for coinservice.
#              Run once against a fresh host on port 22. After completion,
#              update inventory ansible_port to ssh_port for all future runs.
# Requirements:
#   - Ansible 2.10+
#   - ansible-galaxy collection install -r requirements.yml
#   - Target: Debian/Ubuntu (RedHat support partial)
# Variables required at runtime:
#   - ssh_port: non-standard SSH port to bind (required)
#   - deploy_ssh_public_key: SSH public key for the CI/CD deploy user (required)
#   - admin_user: username for the personal break-glass account (required)
#   - admin_ssh_public_key: SSH public key for the admin user (required)
# For coinservice_nginx_hosts, server_name and SSL cert paths are set as host vars
# in the inventory rather than passed at runtime (they differ per host).
# For the Alloy play (coinservice_hosts), grafana_cloud_prometheus_url/user and
# grafana_cloud_loki_url/user live in vars/setup.yml; only grafana_cloud_api_key
# must be passed at runtime (it is the secret Grafana Cloud API token).
# Usage:
#   ansible-playbook -i inventory/hosts setup.yml \
#     -e ssh_port=XXXXX \
#     -e deploy_ssh_public_key="ssh-ed25519 AAAA..." \
#     -e admin_user=matt \
#     -e admin_ssh_public_key="ssh-ed25519 AAAA..."

- name: Bootstrap VPS for coinservice
  hosts: coinservice_hosts
  become: true
  gather_facts: true

  vars_files:
    - vars/setup.yml

  pre_tasks:
    - name: Install Python 3 (raw — runs before Python is available)
      ansible.builtin.raw: |
        command -v python3 || apt-get install -y python3
      changed_when: false
      tags:
        - always

    - name: Assert required variables are provided
      ansible.builtin.assert:
        that:
          - ssh_port is defined
          - ssh_port | int > 1024
          - ssh_port | int < 65535
          - deploy_ssh_public_key is defined
          - deploy_ssh_public_key | length > 0
          - admin_user is defined
          - admin_user | length > 0
          - admin_ssh_public_key is defined
          - admin_ssh_public_key | length > 0
        fail_msg: "ssh_port, deploy_ssh_public_key, admin_user, and admin_ssh_public_key are all required"
      tags:
        - always

    - name: Update package cache and upgrade all packages (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
        cache_valid_time: 0
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - packages

    - name: Update all packages (RedHat)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_facts['os_family'] == "RedHat"
      tags:
        - packages

  tasks:
    # --- Automatic security updates ---

    - name: Install unattended-upgrades (Debian/Ubuntu)
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - security

    - name: Enable automatic security updates (Debian/Ubuntu)
      ansible.builtin.command:
        cmd: dpkg-reconfigure -f noninteractive unattended-upgrades
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - security

    # --- Java ---

    - name: Install required packages for Adoptium repo (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - wget
          - apt-transport-https
          - gnupg
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - java

    - name: Download Adoptium GPG key (Debian/Ubuntu)
      ansible.builtin.get_url:
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        dest: /etc/apt/trusted.gpg.d/adoptium.asc
        mode: '0644'
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - java

    - name: Add Adoptium apt repository (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb https://packages.adoptium.net/artifactory/deb {{ ansible_facts['distribution_release'] }} main"
        state: present
        filename: adoptium
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - java

    - name: Install Temurin JDK (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "temurin-{{ java_version }}-jdk"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - java

    - name: Add Adoptium DNF repository (RedHat)
      ansible.builtin.yum_repository:
        name: adoptium
        description: Adoptium Temurin
        baseurl: https://packages.adoptium.net/artifactory/rpm/rhel/$releasever/$basearch
        gpgkey: https://packages.adoptium.net/artifactory/api/gpg/key/public
        gpgcheck: true
        enabled: true
      when: ansible_facts['os_family'] == "RedHat"
      tags:
        - java

    - name: Install Temurin JDK (RedHat)
      ansible.builtin.dnf:
        name: "temurin-{{ java_version }}-jdk"
        state: present
      when: ansible_facts['os_family'] == "RedHat"
      tags:
        - java

    # --- Timezone ---

    - name: Set system timezone
      community.general.timezone:
        name: "{{ system_timezone }}"
      tags:
        - system

    # --- Users ---

    - name: Ensure deploy group exists
      ansible.builtin.group:
        name: deploy
        state: present
      tags:
        - users

    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: deploy
        group: deploy
        shell: /bin/bash
        create_home: true
        state: present
      tags:
        - users

    - name: Authorize SSH public key for deploy user
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ deploy_ssh_public_key }}"
        state: present
        exclusive: false
      become: yes
      tags:
        - users

    - name: Grant deploy user passwordless sudo
      ansible.builtin.copy:
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/deploy
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      tags:
        - users

    - name: Ensure admin group exists
      ansible.builtin.group:
        name: "{{ admin_user }}"
        state: present
      tags:
        - users

    - name: Ensure admin user exists
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: "{{ admin_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true
        state: present
      tags:
        - users

    - name: Authorize SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_public_key }}"
        state: present
        exclusive: false
      become: yes
      tags:
        - users

    - name: Grant admin user passwordless sudo
      ansible.builtin.copy:
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ admin_user }}"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      tags:
        - users

    - name: Ensure coinservice group exists
      ansible.builtin.group:
        name: coinservice
        system: true
        state: present
      tags:
        - users

    - name: Ensure coinservice system user exists
      ansible.builtin.user:
        name: coinservice
        group: coinservice
        system: true
        shell: /usr/sbin/nologin
        home: /opt/coinservice
        create_home: false
        state: present
      tags:
        - users

    # --- SSH hardening ---

    - name: Set non-standard SSH port
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port '
        line: "Port {{ ssh_port }}"
        state: present
        backup: true
      notify: Restart sshd
      tags:
        - ssh

    - name: Disable root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: Restart sshd
      tags:
        - ssh

    - name: Disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: Restart sshd
      tags:
        - ssh

    - name: Disable challenge-response authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?ChallengeResponseAuthentication'
        line: 'ChallengeResponseAuthentication no'
        state: present
      notify: Restart sshd
      tags:
        - ssh

    - name: Restrict SSH access to deploy and admin users
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowUsers'
        line: "AllowUsers deploy {{ admin_user }} ubuntu"
        state: present
      notify: Restart sshd
      tags:
        - ssh

    - name: Disable X11 forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
        state: present
      notify: Restart sshd
      tags:
        - ssh

    # --- Firewall ---

    - name: Install ufw (Debian/Ubuntu)
      ansible.builtin.apt:
        name: ufw
        state: present
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - firewall

    - name: Allow SSH on non-standard port
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH"
      tags:
        - firewall

    - name: Allow HTTPS (443)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
        comment: "HTTPS"
      tags:
        - firewall

    - name: Allow outbound HTTPS for Azure services
      community.general.ufw:
        rule: allow
        direction: out
        port: "443"
        proto: tcp
        comment: "Outbound HTTPS (Azure App Configuration, Key Vault)"
      tags:
        - firewall
        - azure

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      tags:
        - firewall

    # --- Port redirect 443 → 8443 via ufw before.rules ---

    - name: Insert NAT redirect rules into ufw before.rules
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED - coinservice NAT redirect"
        block: |
          *nat
          :PREROUTING ACCEPT [0:0]
          :OUTPUT ACCEPT [0:0]
          {% for host in groups['coinservice_app_hosts'] %}
          -A PREROUTING -p tcp -d {{ hostvars[host]['ansible_host'] }} --dport 443 -j REDIRECT --to-port 8443
          {% endfor %}
          -A OUTPUT -p tcp -d 127.0.0.1 --dport 443 -j REDIRECT --to-port 8443
          COMMIT
      when: nat_redirect == "true" | default(false)
      notify: Reload ufw
      tags:
        - firewall
        - nat

    - name: Insert NAT redirect rules into ufw before6.rules (IPv6)
      ansible.builtin.blockinfile:
        path: /etc/ufw/before6.rules
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED - coinservice NAT redirect"
        block: |
          *nat
          :PREROUTING ACCEPT [0:0]
          :OUTPUT ACCEPT [0:0]
          {% for host in groups['coinservice_app_hosts'] %}
          {% if hostvars[host]['ipv6_address'] is defined %}
          -A PREROUTING -p tcp -d {{ hostvars[host]['ipv6_address'] }} --dport 443 -j REDIRECT --to-port 8443
          {% endif %}
          {% endfor %}
          -A OUTPUT -p tcp -d ::1 --dport 443 -j REDIRECT --to-port 8443
          COMMIT
      when: nat_redirect == "true" | default(false)
      notify: Reload ufw
      tags:
        - firewall
        - nat

    # --- Kernel hardening ---

    - name: Apply network hardening sysctl parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-coinservice-hardening.conf
      loop:
        - { key: net.ipv4.tcp_syncookies,                 value: "1" }
        - { key: net.ipv4.conf.all.accept_redirects,      value: "0" }
        - { key: net.ipv4.conf.default.accept_redirects,  value: "0" }
        - { key: net.ipv4.conf.all.send_redirects,        value: "0" }
        - { key: net.ipv4.conf.default.send_redirects,    value: "0" }
        - { key: net.ipv4.conf.all.accept_source_route,   value: "0" }
        - { key: net.ipv6.conf.all.accept_redirects,      value: "0" }
        - { key: net.ipv6.conf.default.accept_redirects,  value: "0" }
        - { key: net.ipv6.conf.all.accept_source_route,   value: "0" }
        - { key: net.ipv6.conf.default.accept_source_route, value: "0" }
        - { key: kernel.randomize_va_space,               value: "2" }
      tags:
        - sysctl
        - security

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        state: restarted

    - name: Reload ufw
      community.general.ufw:
        state: reloaded

- name: Configure nginx on coinservice_nginx_hosts
  hosts: coinservice_nginx_hosts
  become: true
  gather_facts: true

  vars_files:
    - vars/setup.yml

  pre_tasks:
    - name: Assert nginx-specific variables are provided
      ansible.builtin.assert:
        that:
          - server_name is defined
          - server_name | length > 0
          - nginx_ssl_certificate is defined
          - nginx_ssl_certificate | length > 0
          - nginx_ssl_certificate_key is defined
          - nginx_ssl_certificate_key | length > 0
        fail_msg: "server_name, nginx_ssl_certificate, and nginx_ssl_certificate_key are required"
      tags:
        - always

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - nginx

    - name: Create SSL certificate directory
      ansible.builtin.file:
        path: "{{ nginx_ssl_certificate | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      tags:
        - nginx
        - ssl

    - name: Copy SSL certificate
      ansible.builtin.copy:
        src: "{{ inventory_hostname }}-fullchain.pem"
        dest: "{{ nginx_ssl_certificate }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload nginx
      tags:
        - nginx
        - ssl

    - name: Copy SSL private key
      ansible.builtin.copy:
        src: "{{ inventory_hostname }}-privkey.pem"
        dest: "{{ nginx_ssl_certificate_key }}"
        owner: root
        group: root
        mode: '0600'
      notify: Reload nginx
      tags:
        - nginx
        - ssl

    - name: Create SPA webroot
      ansible.builtin.file:
        path: "{{ nginx_webroot }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      tags:
        - nginx

    - name: Deploy global nginx.conf
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      run_once: true
      notify: Reload nginx
      tags:
        - nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx
      tags:
        - nginx

    - name: Deploy site config
      ansible.builtin.template:
        src: templates/site.conf.j2
        dest: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: Reload nginx
      tags:
        - nginx

    - name: Enable site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}.conf"
        state: link
      notify: Reload nginx
      tags:
        - nginx

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
      tags:
        - nginx

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

- name: Install and configure Grafana Alloy on coinservice_hosts
  hosts: coinservice_hosts
  become: true
  gather_facts: true

  vars_files:
    - vars/setup.yml

  pre_tasks:
    - name: Assert Grafana Cloud API key is provided
      ansible.builtin.assert:
        that:
          - grafana_cloud_api_key is defined
          - grafana_cloud_api_key | length > 0
          - grafana_cloud_prometheus_url | length > 0
          - grafana_cloud_prometheus_user | string | length > 0
          - grafana_cloud_loki_url | length > 0
          - grafana_cloud_loki_user | string | length > 0
        fail_msg: "grafana_cloud_api_key is required at runtime; verify grafana_cloud_prometheus_url/user and grafana_cloud_loki_url/user are set in vars/setup.yml"
      tags:
        - always

  tasks:
    - name: Install and configure Grafana Alloy
      ansible.builtin.include_role:
        name: grafana.grafana.alloy
        apply:
          tags:
            - alloy
            - grafana
      tags:
        - alloy
        - grafana
      vars:
        alloy_config: |
          // --------------------------------
          // Metrics: host system (CPU, memory, disk, network)
          // --------------------------------

          prometheus.exporter.unix "node" {}

          prometheus.scrape "node" {
            targets         = prometheus.exporter.unix.node.targets
            forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
            scrape_interval = "60s"
          }

          prometheus.remote_write "grafana_cloud" {
            endpoint {
              url = "{{ grafana_cloud_prometheus_url }}"

              basic_auth {
                username = "{{ grafana_cloud_prometheus_user }}"
                password = "{{ grafana_cloud_api_key }}"
              }
            }
          }

          // --------------------------------
          // Metrics: coinservice JVM (heap, GC, threads, HTTP)
          // --------------------------------

          prometheus.scrape "coinservice_jvm" {
            targets = [
              {% for host in groups['coinservice_app_hosts'] %}
              { __address__ = "{{ hostvars[host]['ansible_host'] }}:8081" },
              {% endfor %}
            ]
            metrics_path    = "/actuator/prometheus"
            forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
            scrape_interval = "30s"
          }

          // --------------------------------
          // Logs: coinservice systemd journal
          // --------------------------------

          {% for env in ['development', 'production'] %}
          loki.source.journal "coinservice_{{ env }}" {
            matches    = "_SYSTEMD_UNIT=coinservice-{{ env }}.service"
            max_age    = "12h"
            labels     = { job = "coinservice", env = "{{ env }}" }
            forward_to = [loki.write.grafana_cloud.receiver]
          }
          {% endfor %}

          loki.write "grafana_cloud" {
            endpoint {
              url = "{{ grafana_cloud_loki_url }}"

              basic_auth {
                username = "{{ grafana_cloud_loki_user }}"
                password = "{{ grafana_cloud_api_key }}"
              }
            }
          }
